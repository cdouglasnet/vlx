name: Beta Release

on:
  push:
    branches: [ beta ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify Python syntax
      run: |
        python -m py_compile config.py configStore.py inspections.py get_report.py

    - name: Get version from build.sh
      id: version
      run: |
        VERSION=$(grep 'VERSION=' build.sh | head -1 | sed 's/VERSION="\([^"]*\)"/\1/')
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Workflow version: $VERSION"

    - name: Build workflow
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Verify build
      run: |
        test -f VLX.alfredworkflow || exit 1
        unzip -t VLX.alfredworkflow
        echo "✅ Workflow built successfully"

    - name: Upload workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: VLX-v${{ steps.version.outputs.VERSION }}-beta
        path: VLX.alfredworkflow
        retention-days: 7

  release:
    needs: build
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Get version info
      id: version
      run: |
        VERSION=$(grep 'VERSION=' build.sh | head -1 | sed 's/VERSION="\([^"]*\)"/\1/')
        TIMESTAMP=$(date +%Y%m%d%H%M%S)
        RELEASE_TAG="v${VERSION}-beta-${TIMESTAMP}"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_OUTPUT
        echo "✅ Beta version ${VERSION} ready for release"

    - name: Build workflow
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Generate changelog
      id: changelog
      run: |
        LATEST_PROD_TAG=$(git tag -l "v*" | grep -v beta | sort -V | tail -1)
        if [ -z "$LATEST_PROD_TAG" ]; then
          echo "No production release found, including recent commits"
          COMMITS=$(git log --pretty=format:"- %s" | head -20)
        else
          echo "Generating changelog since $LATEST_PROD_TAG"
          COMMITS=$(git log --pretty=format:"- %s" $LATEST_PROD_TAG..HEAD)
        fi
        
        cat > CHANGELOG.md << EOF
        ## 🚧 Beta Release v${{ steps.version.outputs.VERSION }}
        
        **⚠️ This is a beta release for testing purposes.**
        
        ### What's New
        $COMMITS
        EOF
        
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        cat CHANGELOG.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create beta release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.RELEASE_TAG }}
        name: "🚧 Beta Release v${{ steps.version.outputs.VERSION }}"
        body: ${{ steps.changelog.outputs.changelog }}
        files: VLX.alfredworkflow
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

