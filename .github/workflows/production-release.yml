name: Production Release

on:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify Python syntax
      run: |
        python -m py_compile config.py configStore.py inspections.py get_report.py

    - name: Get version from build.sh
      id: version
      run: |
        VERSION=$(grep 'VERSION=' build.sh | head -1 | sed 's/VERSION="\([^"]*\)"/\1/')
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Workflow version: $VERSION"
        
    - name: Build workflow
      run: |
        chmod +x build.sh
        ./build.sh
        
    - name: Verify build
      run: |
        test -f VLX.alfredworkflow || exit 1
        unzip -t VLX.alfredworkflow
        echo "✅ Workflow built successfully"
        
    - name: Upload workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: VLX-v${{ steps.version.outputs.VERSION }}
        path: VLX.alfredworkflow
        retention-days: 30
        
  release:
    needs: build
    runs-on: macos-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Get version info
      id: version
      run: |
        VERSION=$(grep 'VERSION=' build.sh | head -1 | sed 's/VERSION="\([^"]*\)"/\1/')
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        
        RELEASE_TAG="v${VERSION}"
        echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_OUTPUT
        
        if git fetch origin "refs/tags/${RELEASE_TAG}" 2>/dev/null; then
          echo "⚠️  Version ${VERSION} was already released"
          echo "already_released=true" >> $GITHUB_OUTPUT
        else
          echo "✅ New version ${VERSION} ready for release"
          echo "already_released=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Build workflow
      run: |
        chmod +x build.sh
        ./build.sh
        
    - name: Skip if already released
      if: steps.version.outputs.already_released == 'true'
      run: |
        echo "Skipping release - version ${{ steps.version.outputs.VERSION }} was already released"

    - name: Generate changelog
      id: changelog
      if: steps.version.outputs.already_released != 'true'
      run: |
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -z "$PREVIOUS_TAG" ]; then
          echo "No previous tag found, including recent commits"
          COMMITS=$(git log --pretty=format:"- %s" | head -20)
        else
          echo "Generating changelog since $PREVIOUS_TAG"
          COMMITS=$(git log --pretty=format:"- %s" $PREVIOUS_TAG..HEAD)
        fi
        
        # Create changelog
        cat > CHANGELOG.md << EOF
        ## Release v${{ steps.version.outputs.VERSION }}
        
        ### What's New
        $COMMITS
        
        [View all changes](https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG..HEAD)
        EOF
        
        CHANGELOG=$(cat CHANGELOG.md)
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create release
      uses: softprops/action-gh-release@v1
      if: steps.version.outputs.already_released != 'true'
      with:
        tag_name: ${{ steps.version.outputs.RELEASE_TAG }}
        name: Release ${{ steps.version.outputs.RELEASE_TAG }}
        body: ${{ steps.changelog.outputs.changelog }}
        files: VLX.alfredworkflow
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

